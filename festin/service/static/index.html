<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FestIn — S3 Exposure Monitor</title>
    <link rel="icon" href="/static/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
    <link rel="apple-touch-icon" href="/static/favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="flash-toast" class="flash flash-hidden" hidden></div>

    <!-- Auth -->
    <section id="view-login" class="login-wrap" hidden>
        <div class="login-panel">
            <div class="wordmark">FESTIN</div>
            <div class="micro login-sub">S3 EXPOSURE MONITOR</div>
            <form id="login-form" data-form="login" novalidate>
                <label class="micro field-label" for="login-username">USERNAME</label>
                <input id="login-username" name="username" autocomplete="username" spellcheck="false">
                <label class="micro field-label" for="login-password">PASSWORD</label>
                <input id="login-password" type="password" autocomplete="current-password">
                <div id="login-mode" class="micro login-mode">// first account becomes ADMIN</div>
                <div id="login-error" class="form-error" hidden></div>
                <button type="submit" id="login-submit" class="btn btn-primary btn-block">SIGN IN</button>
                <button type="button" id="register-toggle" class="btn btn-ghost btn-block" data-action="toggle-register">CREATE ADMIN ACCOUNT</button>
            </form>
        </div>
    </section>

    <!-- Shell -->
    <div id="shell" class="shell" hidden>
        <aside class="sidebar">
            <div class="brand">
                <img src="/static/favicon-32.png" alt="" class="brand-mark" width="28" height="28">
                <div class="wordmark wordmark-sm">FESTIN</div>
            </div>
            <div class="brand-sub micro">S3 EXPOSURE MONITOR</div>
            <div class="brand-sep"></div>
            <nav class="nav" aria-label="primary">
                <a href="#/projects" class="nav-link" data-nav="projects">PROJECTS</a>
                <a href="#/scans" class="nav-link" data-nav="scans">SCANS</a>
                <a href="#/findings" class="nav-link" data-nav="findings">FINDINGS</a>
                <a href="#/users" class="nav-link" data-nav="users" data-admin-only hidden>USERS</a>
            </nav>
            <div class="sidebar-foot">
                <div class="brand-sep"></div>
                <div id="health-strip" class="health-strip">&bull; SCHED &mdash; &middot; PENDING &mdash;</div>
            </div>
        </aside>

        <div class="main">
            <header class="topbar">
                <h1 id="view-title" class="view-title">PROJECTS</h1>
                <div class="user-area">
                    <span class="user-chip"><span id="chip-user"></span><span id="chip-role" class="chip-role"></span></span>
                    <button type="button" class="btn btn-ghost" data-action="logout">LOGOUT</button>
                </div>
            </header>
            <main class="content">
                <section id="view-projects" class="view" hidden></section>
                <section id="view-project" class="view" hidden></section>
                <section id="view-scans" class="view" hidden></section>
                <section id="view-scan" class="view" hidden></section>
                <section id="view-findings" class="view" hidden></section>
                <section id="view-users" class="view" hidden></section>
            </main>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
