[project]
name = "festin"
version = "0.3.2"
description = "Credentialless discovery and monitoring of exposed S3-compatible cloud storage from domains, DNS and web crawling"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Free for personal and professional use; hosted or paid services and commercial redistribution require a separate agreement with the author" }
license-files = ["LICENSE"]
authors = [{ name = "Daniel Alfocea", email = "daniel@danielalfocea.com" }]

dependencies = [
    "aiohttp>=3.14",
    "aiofiles>=24.1",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "colorama>=0.4.6",
    "dnspython>=2.7",
    "fastapi>=0.115",
    "httpx[socks]>=0.28",
    "lxml>=6.0",
    "passlib[bcrypt]>=1.7",
    "pydantic>=2.0",
    "python-jose[cryptography]>=3.3",
    "redis>=5.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
    "watchfiles>=1.1",
]

classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/cr0hn/festin"

[project.scripts]
festin = "festin.cli:main"
festin-serve = "festin.service.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.4",
    "ruff>=0.13",
    "respx>=0.23.1",
    "aiohttp>=3.14.3",
    "radon>=6.0.1",
    "pyyaml>=6.0.3",
    "pytest-aiohttp>=1.1.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "mkdocs-minify-plugin>=0.8.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["festin", "festin.service"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60
markers = ["integration: tests requiring external services (PostgreSQL, Redis)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
