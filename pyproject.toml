[project]
name = "festin"
version = "0.2.0"
description = "Festin is a powered S3 bucket finder and content discover"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Free for personal and professional use; hosted or paid services and commercial redistribution require a separate agreement with the author" }
license-files = ["LICENSE"]
authors = [{ name = "cr0hn", email = "cr0hn@cr0hn.com" }]
dependencies = [
    "aiohttp>=3.14",
    "aiofiles>=24.1",
    "colorama>=0.4.6",
    "dnspython>=2.7",
    "httpx[socks]>=0.28",
    "lxml>=6.0",
    "typer>=0.12",
    "watchfiles>=1.1",
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/cr0hn/festin"

[project.scripts]
festin = "festin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-timeout>=2.4",
    "ruff>=0.13",
    "respx>=0.23.1",
    "aiohttp>=3.14.3",
    "radon>=6.0.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["festin"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
