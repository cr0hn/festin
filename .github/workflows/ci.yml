name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check festin tests
          uv run ruff format --check festin tests

      - name: Complexity gate (max 20 per function)
        run: uv run radon cc festin -n C --total-average

      - name: Tests
        env:
          NO_COLOR: "1"
          COLUMNS: "200"
          LINES: "200"
        run: uv run pytest -v

      - name: Smoke test
        env:
          NO_COLOR: "1"
          COLUMNS: "200"
          LINES: "200"
        run: uv run python -m festin --help

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build distributions
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Publish to PyPI on every push to master once tests pass.
    # Trusted Publishing (OIDC): configure a "pypi" publisher on pypi.org for
    # this repo + workflow (https://docs.pypi.org/trusted-publishers/).
    # Until that is configured, `publish` fails and `publish-token` retries
    # with the legacy API token secret (`pypi_password`). To disable the token
    # fallback after configuring Trusted Publishing, set the repo variable
    # USE_TRUSTED_PUBLISHING=true.
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/p/festin
    permissions:
      id-token: write  # OIDC for Trusted Publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-token:
    # Fallback path when Trusted Publishing is not configured on PyPI.
    # Requires the legacy API token stored as the `pypi_password` secret.
    runs-on: ubuntu-latest
    needs: [build, publish]
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      vars.USE_TRUSTED_PUBLISHING != 'true' &&
      failure()
    environment:
      name: pypi
      url: https://pypi.org/p/festin
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.pypi_password }}